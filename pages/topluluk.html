    <script>

    (function(){

        var challenges = [

            { title:'Yaz Kombini Challenge', desc:'En yaratc yaz kombinini olustur ve paylas! En ok begeni alan kazanr.', participants:12, deadline:'15 Haziran' },

            { title:'? Sokak Stili Challenge', desc:'Gnlk sokak stilini yanstan bir kombin yap. ?zgnlk nemli!', participants:8, deadline:'20 Haziran' },

            { title:' Ofis kls Challenge', desc:'? hayatnda ?k ve profesyonel bir kombin olustur.', participants:5, deadline:'25 Haziran' }

        ];

        var grid=document.getElementById('challengeGrid');

        challenges.forEach(function(c){

            var div=document.createElement('div');

            div.className='challenge-card';

            div.innerHTML='<h3>'+c.title+'</h3><p>'+c.desc+'</p><div class="challenge-meta"><span>'+c.participants+' katlmc</span><span>'+c.deadline+'</span><button class="join-btn" onclick="alert(\'Challenge\'a katldn!\\nKombinini olustur ve #\'+this.parentElement.parentElement.querySelector(\'h3\').textContent.split(\' \')[0]+\' etiketiyle paylas.\')">Katl</button></div>';

            grid.appendChild(div);

        });

    })();
