    <style>

        .notif-item { display:flex; gap:12px; padding:16px; border-radius:8px; margin-bottom:8px; background:#f5f5f5; align-items:center; cursor:pointer; transition:background 0.2s; }

        .notif-item:hover { background:#eee; }

        .notif-item.unread { border-left:3px solid #e74c3c; background:#fdf2f2; }

        .notif-icon { font-size:20px; }

        .notif-body { flex:1; }

        .notif-body p { font-size:14px; color:#333; margin-bottom:2px; }

        .notif-body span { font-size:11px; color:#999; }

        .notif-empty { text-align:center; padding:60px 0; color:#999; }

        .dark .notif-item { background:#252525; }

        .dark .notif-item:hover { background:#333; }

        .dark .notif-item.unread { background:#2a1a1a; border-left-color:#e74c3c; }

        .dark .notif-body p { color:#ccc; }

    </style>

    <script src="../assets/js/main.js"></script>

    <script>

    (function() {

        var user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

        if (!user) { document.getElementById('notifList').innerHTML = '<div class="notif-empty"><p>Bildirimleri grmek iin giri? yap.</p><a href="giris.html" class="btn-primary" style="margin-top:16px;">Giriş Yap</a></div>'; return; }

        var notifs = JSON.parse(localStorage.getItem('clothink_notifs_' + user.email) || '[]');

        var list = document.getElementById('notifList');

        if (notifs.length === 0) { list.innerHTML = '<div class="notif-empty"><p>Henz bildirimin yok.</p></div>'; return; }

        var html = '';

        notifs.forEach(function(n, i) {

            var icon = n.type === 'like' ? '' : n.type === 'follow' ? '' : n.type === 'comment' ? '' : '';

            html += '<div class="notif-item' + (!n.read ? ' unread' : '') + '" onclick="markRead(' + i + ')"><div class="notif-icon">' + icon + '</div><div class="notif-body"><p>' + n.message + '</p><span>' + new Date(n.date).toLocaleDateString('tr-TR') + '</span></div></div>';

        });

        list.innerHTML = html;

        window.markRead = function(idx) {

            var notifs = JSON.parse(localStorage.getItem('clothink_notifs_' + user.email) || '[]');

            if (notifs[idx]) { notifs[idx].read = true; localStorage.setItem('clothink_notifs_' + user.email, JSON.stringify(notifs)); }

            window.location.reload();

        };

        // mark all as read

        notifs.forEach(function(n) { n.read = true; });

        localStorage.setItem('clothink_notifs_' + user.email, JSON.stringify(notifs));

    })();

    </script>
