    <script src="../assets/js/main.js"></script>

    <script>

    (function() {

        var user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

        if (!user) { document.getElementById('notifList').innerHTML = '<div class="notif-empty"><p>Bildirimleri grmek iin giri? yap.</p><a href="giris.html" class="btn-primary" style="margin-top:16px;">Giris Yap</a></div>'; return; }

        var notifs = JSON.parse(localStorage.getItem('clothink_notifs_' + user.email) || '[]');

        var list = document.getElementById('notifList');

        if (notifs.length === 0) { list.innerHTML = '<div class="notif-empty"><p>Henz bildirimin yok.</p></div>'; return; }

        var html = '';

        notifs.forEach(function(n, i) {

            var icon = n.type === 'like' ? 'L' : n.type === 'follow' ? 'T' : n.type === 'comment' ? 'Y' : 'B';

            html += '<div class="notif-item' + (!n.read ? ' unread' : '') + '" onclick="markRead(' + i + ')"><div class="notif-icon">' + icon + '</div><div class="notif-body"><p>' + n.message + '</p><span>' + new Date(n.date).toLocaleDateString('tr-TR') + '</span></div></div>';

        });

        list.innerHTML = html;

        window.markRead = function(idx) {

            var notifs = JSON.parse(localStorage.getItem('clothink_notifs_' + user.email) || '[]');

            if (notifs[idx]) { notifs[idx].read = true; localStorage.setItem('clothink_notifs_' + user.email, JSON.stringify(notifs)); }

            window.location.reload();

        };

        // mark all as read

        // Notifications: user must click to mark read

        localStorage.setItem('clothink_notifs_' + user.email, JSON.stringify(notifs));

    })();

    </script>
