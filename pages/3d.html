<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Goruntule - Clothink</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body { background: #0a0a0a; color: #fff; min-height: 100vh; }
        .viewer-wrap { max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .viewer-wrap h1 { font-size: 28px; font-weight: 300; letter-spacing: -1px; margin-bottom: 24px; color: #c9a84c; }
        .3d-canvas-wrap { background: #111; border-radius: 0; overflow: hidden; aspect-ratio: 4/3; position: relative; display: flex; align-items: center; justify-content: center; }
        .3d-placeholder { color: #333; font-size: 14px; }
        .3d-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .3d-controls button { background: transparent; border: 1px solid #333; color: #888; padding: 10px 20px; cursor: pointer; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; font-family: 'Inter',sans-serif; transition: all 0.3s; }
        .3d-controls button:hover { border-color: #c9a84c; color: #c9a84c; }
        .back-link { color: #666; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 20px; }
        .back-link:hover { color: #c9a84c; }
    </style>
</head>
<body>
    <div class="viewer-wrap">
        <a href="javascript:history.back()" class="back-link">← Geri</a>
        <h1>3D Model Goruntuleyici</h1>
        <div class="3d-canvas-wrap" id="viewerContainer">
            <div class="3d-placeholder" id="placeholder">3D model yukleniyor...</div>
        </div>
        <div class="3d-controls">
            <button onclick="rotateModel(-90)">Sola Dondur</button>
            <button onclick="rotateModel(90)">Saga Dondur</button>
            <button onclick="resetModel()">Sifirla</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        var scene, camera, renderer, model, rotation = 0;
        var container = document.getElementById('viewerContainer');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 1.5, 5);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // Lighting
            var ambient = new THREE.AmbientLight(0x404040, 1.5);
            scene.add(ambient);
            var directional = new THREE.DirectionalLight(0xffffff, 2);
            directional.position.set(5, 5, 5);
            scene.add(directional);
            var backLight = new THREE.DirectionalLight(0xc9a84c, 1);
            backLight.position.set(-3, 2, -3);
            scene.add(backLight);

            // Floor
            var floor = new THREE.Mesh(
                new THREE.PlaneGeometry(8, 8),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.8;
            scene.add(floor);

            // Mannequin body
            model = new THREE.Group();

            // Torso
            var torso = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.5, 1.2, 32),
                new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3, metalness: 0.2 })
            );
            torso.position.y = 0.4;
            model.add(torso);

            // Head
            var head = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3 })
            );
            head.position.y = 1.2;
            model.add(head);

            // Left leg
            var leftLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.18, 1.2, 32),
                new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 })
            );
            leftLeg.position.set(-0.15, -0.8, 0);
            model.add(leftLeg);

            // Right leg
            var rightLeg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.18, 1.2, 32),
                new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 })
            );
            rightLeg.position.set(0.15, -0.8, 0);
            model.add(rightLeg);

            // Left arm
            var leftArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.1, 0.8, 16),
                new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3 })
            );
            leftArm.position.set(-0.55, 0.6, 0);
            leftArm.rotation.z = 0.3;
            model.add(leftArm);

            // Right arm
            var rightArm = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.1, 0.8, 16),
                new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.3 })
            );
            rightArm.position.set(0.55, 0.6, 0);
            rightArm.rotation.z = -0.3;
            model.add(rightArm);

            scene.add(model);

            // Gold ring around mannequin
            var ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.7, 0.02, 16, 64),
                new THREE.MeshStandardMaterial({ color: 0xc9a84c, roughness: 0.2, metalness: 0.8 })
            );
            ring.position.y = -0.35;
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            document.getElementById('placeholder').style.display = 'none';
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            model.rotation.y += (rotation - model.rotation.y) * 0.05;
            renderer.render(scene, camera);
        }

        window.rotateModel = function(deg) { rotation += deg * (Math.PI / 180); };
        window.resetModel = function() { rotation = 0; model.rotation.y = 0; };

        window.addEventListener('resize', function() {
            if (container) {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });

        init();
    </script>
</body>
</html>
