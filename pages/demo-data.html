    var allUsers = JSON.parse(localStorage.getItem('clothink_users') || '[]');
    var profiles = JSON.parse(localStorage.getItem('clothink_profiles') || '{}');

    function genAvatar(name, idx) {
        var c = document.createElement('canvas'); c.width=160; c.height=160;
        var ctx=c.getContext('2d');
        var palette=['#c9a84c','#8b5e3c','#4a6d8c','#7d5a50','#2c3e50','#6b4c3a','#3a5a40','#5c3d5c','#1a1a2e','#16213e','#5c3a2e','#3a4a3c','#4a2e3c','#2e4a4c','#6a5a3c','#3c2a4e','#4a6a5e','#8a6a3c','#5a3a6e','#3a6a5c'];
        ctx.fillStyle=palette[idx%palette.length];
        ctx.fillRect(0,0,160,160);
        ctx.fillStyle='#fff';
        ctx.font='bold 64px \"Playfair Display\",serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(name.charAt(0).toUpperCase(),80,84);
        return c.toDataURL('image/png');
    }

    B.forEach(function(u, i) {
        var ex = allUsers.findIndex(function(e){return e.email===u.email;});
        if (ex===-1) allUsers.push({name:u.name, email:u.email, password:'123456'});
        profiles[u.email]={username:u.username, bio:u.bio, gender:u.gender};
        localStorage.setItem('clothink_avatar_'+u.email, genAvatar(u.name,i));

        var cat=C[u.gender];
        var outfits=[];
        cat.forEach(function(c,ci){
            outfits.push({title:c.T,image:c.i,items:c.p.length,products:c.p,likes:c.l});
        });
        localStorage.setItem('clothink_outfits_'+u.email, JSON.stringify(outfits));

        // Cross-likes
        var likes=[];
        B.forEach(function(o){
            if(o.email===u.email) return;
            var oc=C[o.gender];
            if(oc&&oc.length) {
                likes.push(oc[0].i);
                if(oc.length>1) likes.push(oc[1].i);
            }
        });
        localStorage.setItem('clothink_likes_'+u.email, JSON.stringify(likes));

        // Follow a few others
        var follow=[];
        B.forEach(function(o,j){
            if(o.email!==u.email&&j%3===i%3) follow.push(o.email);
        });
        localStorage.setItem('clothink_following_'+u.email, JSON.stringify(follow));
    });

    localStorage.setItem('clothink_demo_ready','1');

    allUsers.forEach(function(u){

        total+=o.length;
    });
