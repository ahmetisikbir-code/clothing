<body>
<div class="card">

    U('Koray Sahin','koray@real.demo','erkek','koraysahin','Sef asci. Mutfakta oldugu kadar disarida da stiline onem veriyor. Akdeniz esintili rahat tarz.'),

    O('Boardroom Power',null,312,'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400&h=600&fit=crop','Toplanti gunu icin kendinden emin bir kombin. Ipek ve yun kumaslar.',[P('Tailored Blazer','ARMANI','TL5.499','https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=100&h=100&fit=crop'),P('Ipek Gomlek','MANGO','TL899','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Kalem Etek','BOSS','TL1.299','https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=100&h=100&fit=crop'),P('Stiletto','JIMMY CHOO','TL4.999','https://images.unsplash.com/photo-1543163521-2bf539246bf6?w=100&h=100&fit=crop'),P('Structured Tote','PRADA','TL8.999','https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=100&h=100&fit=crop')]),
    O('Sunday Brunch',null,189,'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400&h=600&fit=crop','Arkadaslarla brunch icin effortless chic.',[P('Trench Coat','BURBERRY','TL12.999','https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100&h=100&fit=crop'),P('Cashmere Sweater','COS','TL1.299','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Mom Jeans','LEVIS','TL899','https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=100&h=100&fit=crop')]),
    O('Date Night',null,278,'https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=400&h=600&fit=crop','Bogazda bir aksam yemegi icin romantik ve feminen.',[P('Slip Dress','ZARA','TL699','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Deri Ceket','ALLSAINTS','TL3.499','https://images.unsplash.com/photo-1559551409-dadc959f76b8?w=100&h=100&fit=crop'),P('Strappy Heels','MANGO','TL1.499','https://images.unsplash.com/photo-1543163521-2bf539246bf6?w=100&h=100&fit=crop'),P('Mini Crossbody','GUCCI','TL5.999','https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=100&h=100&fit=crop')]),
    O('Client Meeting',null,198,'https://images.pexels.com/photos/26524770/pexels-photo-26524770.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1','Musteri toplantisi icin profesyonel ama rahat.',[P('Navy Blazer','BOSS','TL6.999','https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=100&h=100&fit=crop'),P('Beyaz Oxford Gomlek','ZARA','TL649','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Tailored Chinos','COS','TL849','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'),P('Derby Ayakkabi','ARMANI','TL3.999','https://images.unsplash.com/photo-1614251055881-30d2856f13d1?w=100&h=100&fit=crop')]),
    O('Sneakerhead Flex',null,267,'https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?w=400&h=600&fit=crop','Koleksiyonun en yeni parcasini gostermenin tam zamani.',[P('Deri Biker Ceket','ZARA','TL2.299','https://images.unsplash.com/photo-1559551409-dadc959f76b8?w=100&h=100&fit=crop'),P('Graphic Tee','NIKE','TL549','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Cargo Pants','BERSHKA','TL699','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'),P('Air Max 97','NIKE','TL3.499','https://images.unsplash.com/photo-1542291026-3462bba1dd2d?w=100&h=100&fit=crop')]),
    O('Coffee Run',null,145,'https://images.pexels.com/photos/1043473/pexels-photo-1043473.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1','Sabah kahvesi icin hizli ve rahat.',[P('Tech Jacket','THE NORTH FACE','TL2.999','https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100&h=100&fit=crop'),P('Jogger Pant','NIKE','TL899','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'),P('Ultraboost','ADIDAS','TL2.799','https://images.unsplash.com/photo-1542291026-3462bba1dd2d?w=100&h=100&fit=crop')]),
    O('Gallery Walk',null,112,'https://images.pexels.com/photos/1099957/pexels-photo-1099957.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1','Sanat galerisi acilisinda dikkat cek.',[P('Charcoal Blazer','ARMANI','TL7.999','https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=100&h=100&fit=crop'),P('Mavi Oxford','BOSS','TL899','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Wool Trousers','COS','TL1.299','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'),P('Oxford Ayakkabi','ARMANI','TL4.999','https://images.unsplash.com/photo-1614251055881-30d2856f13d1?w=100&h=100&fit=crop')]),
    O('Beach Sunset',null,98,'https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=400&h=600&fit=crop','Kalamista gun batimi, ayaklar kumda.',[P('Linen Shirt','COS','TL599','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Denim Shorts','LEVIS','TL449','https://images.unsplash.com/photo-1542272604-787c3835535d?w=100&h=100&fit=crop'),P('Sandals','ZARA','TL399','https://images.unsplash.com/photo-1543163521-2bf539246bf6?w=100&h=100&fit=crop')]),
    O('Cafe Writing',null,167,'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400&h=600&fit=crop','Moda blogu icin yazi yazarken rahat ama fotogenik.',[P('Oversize Cardigan','H&M','TL599','https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=100&h=100&fit=crop'),P('Basic Tank','ZARA','TL149','https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'),P('Straight Leg Jeans','MANGO','TL749','https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=100&h=100&fit=crop'),P('Loafers','MANGO','TL999','https://images.unsplash.com/photo-1614251055881-30d2856f13d1?w=100&h=100&fit=crop')])
];

function genAvatar(name,idx){
    var c=document.createElement('canvas');c.width=160;c.height=160;
    var ctx=c.getContext('2d');
    var cols=['#c9a84c','#8b5e3c','#4a6d8c','#7d5a50','#2c3e50','#6b4c3a','#3a5a40','#5c3d5c','#1a1a2e','#16213e'];
    ctx.fillStyle=cols[idx%cols.length];ctx.fillRect(0,0,160,160);
    ctx.fillStyle='#fff';ctx.font='bold 64px Playfair Display,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(name.charAt(0).toUpperCase(),80,84);
    return c.toDataURL('image/png');
}

var allU=JSON.parse(localStorage.getItem('clothink_users')||'[]');
var allP=JSON.parse(localStorage.getItem('clothink_profiles')||'{}');

users.forEach(function(u,i){
    var ex=allU.findIndex(function(e){return e.email===u.email;});
    if(ex===-1) allU.push({name:u.name,email:u.email,password:'123456'});
    allP[u.email]={username:u.username,bio:u.bio,gender:u.gender};
    localStorage.setItem('clothink_avatar_'+u.email,genAvatar(u.name,i));

    // Assign 3 outfits per user
    var uo=[];
    for(var j=0;j<3;j++){
        var oi=(i*3+j)%outfits.length;
        uo.push(outfits[oi]);
    }
    localStorage.setItem('clothink_outfits_'+u.email,JSON.stringify(uo));

    // Cross-likes: each user likes 5 random outfit images
    var likes=[];
    for(var k=0;k<5;k++){
        var ri=Math.floor(Math.random()*outfits.length);
        if(outfits[ri].image) likes.push(outfits[ri].image);
    }
    localStorage.setItem('clothink_likes_'+u.email,JSON.stringify(likes));

    // Follow: each user follows 3 others
    var follow=[];
    for(var f=0;f<3;f++){
        var fi=(i+f+1)%users.length;
        if(users[fi].email!==u.email) follow.push(users[fi].email);
    }
    localStorage.setItem('clothink_following_'+u.email,JSON.stringify(follow));
});

localStorage.setItem('clothink_users',JSON.stringify(allU));
localStorage.setItem('clothink_profiles',JSON.stringify(allP));
localStorage.setItem('clothink_demo_ready','1');

var total=0;
allU.forEach(function(u){var o=JSON.parse(localStorage.getItem('clothink_outfits_'+u.email)||'[]');total+=o.length;});

document.getElementById('msg').style.display='block';
document.getElementById('info').textContent=allU.length+' gercekci kullanici · '+total+' kombin · begeniler + takipler hazir';
}
</script>
</body>
</html>
