                { author:'@barisk', items:'5 urun', likes:145, img:'https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?w=400&h=600&fit=crop', title:'Street Edge', desc:'Modern erkegin sehir hayatinda rahat ve tarzli gorunmesi icin ideal kombin.', products:[

                    {name:'Cargo Pants',brand:'BERSHKA',price:'TL699',img:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'},

                    {name:'Derby Ayakkabi',brand:'ARMANI',price:'TL3.999',img:'https://images.unsplash.com/photo-1614251055881-30d2856f13d1?w=100&h=100&fit=crop'}
                ]},
                { author:'@korayt', items:'3 urun', likes:112, img:'https://images.pexels.com/photos/1043473/pexels-photo-1043473.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'Minimal Athlete', desc:'Spor sonrasi hizli bir sekilde sIk gorunmenin sirri.', products:[
                    {name:'Tech Jacket',brand:'THE NORTH FACE',price:'TL2.999',img:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100&h=100&fit=crop'},
                    {name:'Jogger Pant',brand:'NIKE',price:'TL899',img:'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=100&h=100&fit=crop'},
                    {name:'Ultraboost',brand:'ADIDAS',price:'TL2.799',img:'https://images.unsplash.com/photo-1542291026-3462bba1dd2d?w=100&h=100&fit=crop'}
                ]},
                { author:'@alpera', items:'5 urun', likes:167, img:'https://images.pexels.com/photos/1099957/pexels-photo-1099957.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'Classic Gentleman', desc:'Zamansiz erkek modasinin en guzel orneklerinden biri.', products:[
                    {name:'Wool Coat',brand:'ZARA',price:'TL2.999',img:'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100&h=100&fit=crop'},
                    {name:'Turtleneck',brand:'UNIQLO',price:'TL399',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'},
                    {name:'Slim Jeans',brand:"LEVI'S",price:'TL799',img:'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=100&h=100&fit=crop'},
                    {name:'Chelsea Boots',brand:'ZARA',price:'TL1.499',img:'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=100&h=100&fit=crop'},
                    {name:'Leather Belt',brand:'BOSS',price:'TL699',img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=100&h=100&fit=crop'}
                ]}
            ],
            cocuk: [
                { author:'@minikmoda', items:'4 urun', likes:89, img:'https://images.pexels.com/photos/6334338/pexels-photo-6334338.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'Playdate Ready', desc:'Parkta oyun oynamak icin en rahat ve sevimli kombin.', products:[
                    {name:'Leopar Tisort',brand:'ZARA Kids',price:'TL299',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'},
                    {name:'Cotton Leggings',brand:'H&M Kids',price:'TL149',img:'https://images.unsplash.com/photo-1542272604-787c3835535d?w=100&h=100&fit=crop'},
                    {name:'Velcro Sneaker',brand:'NIKE Kids',price:'TL599',img:'https://images.unsplash.com/photo-1542291026-3462bba1dd2d?w=100&h=100&fit=crop'},
                    {name:'Mini Backpack',brand:'ADIDAS Kids',price:'TL299',img:'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=100&h=100&fit=crop'}
                ]},
                { author:'@cocukmoda', items:'3 urun', likes:67, img:'https://images.pexels.com/photos/1620769/pexels-photo-1620769.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'School Cool', desc:'Okulda rahat ve sIk gorunmenin en kolay yolu.', products:[
                    {name:'Hoodie',brand:'NIKE Kids',price:'TL449',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'},
                    {name:'Denim Shorts',brand:'ZARA Kids',price:'TL249',img:'https://images.unsplash.com/photo-1542272604-787c3835535d?w=100&h=100&fit=crop'},
                    {name:'Slip-On Sneaker',brand:'VANS Kids',price:'TL499',img:'https://images.unsplash.com/photo-1542291026-3462bba1dd2d?w=100&h=100&fit=crop'}
                ]},
                { author:'@oyuncakca', items:'5 urun', likes:78, img:'https://images.pexels.com/photos/20975762/pexels-photo-20975762.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'Birthday Party', desc:'Dogum gunu partilerinde en sIk cocuk olmanin sirri.', products:[
                    {name:'Tulle Dress',brand:'ZARA Kids',price:'TL399',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'},
                    {name:'Mary Janes',brand:'H&M Kids',price:'TL299',img:'https://images.unsplash.com/photo-1543163521-2bf539246bf6?w=100&h=100&fit=crop'},
                    {name:'Hair Clip Set',brand:'MANGO Kids',price:'TL99',img:'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=100&h=100&fit=crop'},
                    {name:'Kucuk Canta',brand:'ZARA Kids',price:'TL179',img:'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=100&h=100&fit=crop'},
                    {name:'Cardigan',brand:'H&M Kids',price:'TL249',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'}
                ]},
                { author:'@miniestilo', items:'2 urun', likes:54, img:'https://images.pexels.com/photos/17386406/pexels-photo-17386406.jpeg?auto=compress&cs=tinysrgb&w=400&h=600&dpr=1', title:'Summer Fresh', desc:'Sicak yaz gunlerinde serin kalmak icin ideal kombin.', products:[
                    {name:'Floral Romper',brand:'H&M Kids',price:'TL199',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=100&h=100&fit=crop'},
                    {name:'Sandals',brand:'ZARA Kids',price:'TL179',img:'https://images.unsplash.com/photo-1543163521-2bf539246bf6?w=100&h=100&fit=crop'}
                ]}
            ]
        };

        Object.keys(CATALOG).forEach(function(g) {
            localStorage.setItem('clothink_catalog_' + g, JSON.stringify(CATALOG[g]));
        });

        var users = [
            { name:'Melisa Celik', email:'melisa@demo.com', gender:'kadin', username:'melisac', bio:'Minimalist moda tutkunu | Paris asigi' },
            { name:'Derya Sahin', email:'derya@demo.com', gender:'kadin', username:'deryas', bio:'Avukat & stil ikonu | Business fashion lover' },
            { name:'Asya Guner', email:'asya@demo.com', gender:'kadin', username:'asyag', bio:'Digital creator | Seyahat & moda blog yazari' },
            { name:'Begum Kaya', email:'begum@demo.com', gender:'kadin', username:'begumk', bio:'Lifestyle influencer | Yemek & moda tutkunu' },
            { name:'Baris Koc', email:'baris@demo.com', gender:'erkek', username:'barisk', bio:'Street photographer | Sneaker collector' },
            { name:'Emre Celebi', email:'emre@demo.com', gender:'erkek', username:'emrec', bio:'Tech entrepreneur | Classic menswear lover' },
            { name:'Koray Tumer', email:'koray@demo.com', gender:'erkek', username:'korayt', bio:'Fitness coach | Athleisure enthusiast' },
            { name:'Alper Ates', email:'alper@demo.com', gender:'erkek', username:'alpera', bio:'Architect | Modern gentleman style' },
            { name:'Luna Ozturk', email:'luna@demo.com', gender:'cocuk', username:'minikmoda', bio:'8 yas | Mini fashion blogger' },
            { name:'Efe Yilmaz', email:'efe@demo.com', gender:'cocuk', username:'cocukmoda', bio:'10 yas | Gelecegin stil ikonu' },
            { name:'Maya Demir', email:'maya@demo.com', gender:'cocuk', username:'oyuncakca', bio:'7 yas | Renkli kombinler' },
            { name:'Atlas Kara', email:'atlas@demo.com', gender:'cocuk', username:'miniestilo', bio:'6 yas | Mini stil danismani' }
        ];

        function generateAvatar(name, index) {
            var c = document.createElement('canvas');
            c.width = 160; c.height = 160;
            var ctx = c.getContext('2d');
            var colors = ['#c9a84c','#8b5e3c','#4a6d8c','#7d5a50','#2c3e50','#6b4c3a','#3a5a40','#5c3d5c','#1a1a2e','#16213e'];
            ctx.fillStyle = colors[index % colors.length];
            ctx.fillRect(0, 0, 160, 160);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 64px "Playfair Display", serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name.charAt(0).toUpperCase(), 80, 84);
            return c.toDataURL('image/png');
        }

        var existingUsers = JSON.parse(localStorage.getItem('clothink_users') || '[]');
        var profiles = JSON.parse(localStorage.getItem('clothink_profiles') || '{}');

        users.forEach(function(u, i) {
            var idx = existingUsers.findIndex(function(e) { return e.email === u.email; });
            if (idx === -1) {
                existingUsers.push({ name: u.name, email: u.email, password: '123456' });
            }
            profiles[u.email] = { username: u.username, bio: u.bio, gender: u.gender };

            // Generate unique avatar
            localStorage.setItem('clothink_avatar_' + u.email, generateAvatar(u.name, i));

            var cat = CATALOG[u.gender];
            var userOutfits = [];
            cat.forEach(function(c, ci) {
                userOutfits.push({
                    title: c.title,
                    image: c.img,
                    items: c.products.length,
                    products: c.products,
                    likes: c.likes
                });
            });

            // Give each user extra outfits from other genders for variety
            while (userOutfits.length < 4) {
                var otherKeys = Object.keys(CATALOG);
                for (var g = 0; g < otherKeys.length && userOutfits.length < 4; g++) {
                    if (otherKeys[g] === u.gender) continue;
                    var oc = CATALOG[otherKeys[g]];
                    var oi = userOutfits.length % oc.length;
                    userOutfits.push({
                        title: oc[oi].title + ' (Cross)',
                        image: oc[oi].img,
                        items: oc[oi].products.length,
                        products: oc[oi].products,
                        likes: Math.floor(oc[oi].likes * 0.7)
                    });
                }
            }

            localStorage.setItem('clothink_outfits_' + u.email, JSON.stringify(userOutfits));

            // Cross-likes between users
            var userLikes = [];
            users.forEach(function(other) {
                if (other.email === u.email) return;
                var otherCat = CATALOG[other.gender];
                if (otherCat && otherCat.length) {
                    userLikes.push(otherCat[0].img);
                    if (otherCat.length > 1) userLikes.push(otherCat[1].img);
                }
            });
            localStorage.setItem('clothink_likes_' + u.email, JSON.stringify(userLikes));
        });

        localStorage.setItem('clothink_users', JSON.stringify(existingUsers));
        localStorage.setItem('clothink_profiles', JSON.stringify(profiles));
        localStorage.setItem('clothink_demo_ready', '1');

        var totalOutfits = 0;
        existingUsers.forEach(function(u) {
            var o = JSON.parse(localStorage.getItem('clothink_outfits_' + u.email) || '[]');
            totalOutfits += o.length;
        });

        document.getElementById('msg').style.display = 'block';
        document.getElementById('info').textContent = existingUsers.length + ' kullanici · ' + totalOutfits + ' kombin · begeniler hazir';
    }
    </script>
</body>
</html>
