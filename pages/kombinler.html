        .outfit-hero { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:start; }

        .like-btn-action { background:#f5f5f5; color:#555; font-size:11px; letter-spacing:1px; text-transform:uppercase; }

        .like-btn-action:hover { background:#e8e8e8; }

        .like-btn-action.liked { background:#0a0a0a; color:#fff; }

        .share-btn-action { background:#f5f5f5; color:#555; font-size:11px; letter-spacing:1px; text-transform:uppercase; }

        .share-btn-action:hover { background:#e8e8e8; }

        .save-btn-action { background:#f5f5f5; color:#555; font-size:11px; letter-spacing:1px; text-transform:uppercase; }

        .save-btn-action:hover { background:#e8e8e8; }

        .save-btn-action.saved { background:#c9a84c; color:#fff; }



        /* COMMENTS */

        .comments-box { max-width:700px; margin:0 auto; padding:32px 0; }

        .comments-box h3 { font-size:18px; font-weight:700; margin-bottom:20px; }

        .comment-input-wrap { display:flex; gap:12px; margin-bottom:24px; }

        .comment-input-wrap input { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:8px; font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:border 0.2s; }

        .comment-input-wrap input:focus { border-color:#111; }

        .comment-input-wrap button { padding:12px 20px; border:none; border-radius:8px; background:#111; color:#fff; font-weight:600; cursor:pointer; font-size:13px; font-family:'Inter',sans-serif; white-space:nowrap; }

        .comment-item { display:flex; gap:12px; padding:16px 0; border-bottom:1px solid #eee; }

        .comment-avatar { width:36px; height:36px; border-radius:50%; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }

        .comment-body { flex:1; }

        .comment-author { font-size:13px; font-weight:700; }

        .comment-text { font-size:14px; color:#444; margin-top:4px; line-height:1.5; }

        .comment-date { font-size:11px; color:#999; margin-top:4px; }

        .dark .comment-item { border-bottom-color:#333; }

        .dark .comment-text { color:#bbb; }

        .dark .comment-input-wrap input { background:#333; color:#eee; border-color:#444; }

        .dark .comments-box { background:transparent; }

        .dark .comment-input-wrap input:focus { border-color:#888; }

    </style>

    <script>

    function findEmailByUsername(username) {

        var clean = username.replace('@','').toLowerCase();

        var profiles = JSON.parse(localStorage.getItem('clothink_profiles') || '{}');

        var users = JSON.parse(localStorage.getItem('clothink_users') || '[]');

        for (var i = 0; i < users.length; i++) {

            var p = profiles[users[i].email] || {};

            if (p.username && p.username.toLowerCase() === clean) return users[i].email;

        }

        return null;

    }

    function authorLink(author) {

        var email = findEmailByUsername(author);

        if (email) return 'kullanici.html?u=' + encodeURIComponent(email);

        return 'kullanici.html?user=' + encodeURIComponent(author.replace('@',''));

    }

    (function() {
        var data = null;
        try { data = JSON.parse(localStorage.getItem('clothink_viewing_outfit') || 'null'); } catch(e) { data = null; }
        var container = document.getElementById('detailContainer');

        // Always show catalog grid section
        var grid = document.getElementById('otherGrid');
        grid.innerHTML = '';
        var allOutfits = [];
        ['kadin','erkek','cocuk'].forEach(function(g) {
            var cat = JSON.parse(localStorage.getItem('clothink_catalog_'+g)||'null');
            if (cat) cat.forEach(function(o){ 
                if (!o.author) o.author = o.a || '';
                if (!o.items) o.items = o.t || '';
                if (!o.likes) o.likes = o.l || 0;
                if (!o.img) o.img = o.i || o.image || '';
                if (!o.title) o.title = o.T || '';
                allOutfits.push(o); 
            });
        });
        if (allOutfits.length === 0) {
            allOutfits = [
                {author:'@clothink',items:'3 urun',likes:42,img:'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=400&h=600&fit=crop',title:'Minimalist Chic'},
                {author:'@clothink',items:'5 urun',likes:156,img:'https://images.unsplash.com/photo-1483985988355-763728e1935b?w=400&h=600&fit=crop',title:'Business Elegance'},
                {author:'@clothink',items:'4 urun',likes:89,img:'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400&h=600&fit=crop',title:'Street Style'},
                {author:'@clothink',items:'5 urun',likes:234,img:'https://images.unsplash.com/photo-1552374196-c4e7ffc6e126?w=400&h=600&fit=crop',title:'Casual Friday'}
            ];
        }
        allOutfits.forEach(function(o){
            var div = document.createElement('div');
            div.className = 'outfit-card'; div.style.cursor = 'pointer';
            div.innerHTML = '<div class="outfit-photo" style="background-image:url('+(o.img||o.image)+')"></div><div class="outfit-info"><div><p class="outfit-author">'+(o.author||'')+'</p><p class="outfit-items">'+(o.items||'')+'</p></div><p class="outfit-like">'+(o.likes||0)+'</p></div>';
            div.onclick = function(){ localStorage.setItem('clothink_viewing_outfit', JSON.stringify(o)); window.location.reload(); };
            grid.appendChild(div);
        });

        if (!data) { container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Detay icin bir kombine tiklayin</p>'; return; }

        var user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

        var likes = user ? JSON.parse(localStorage.getItem('clothink_likes_' + user.email) || '[]') : [];

        var saved = user ? (JSON.parse(localStorage.getItem('clothink_saves_' + user.email) || '[]')).indexOf(data.img) > -1 : false;

        var liked = likes.indexOf(data.img) > -1;

        // increment view count

        var views = parseInt(localStorage.getItem('clothink_views_' + data.img.replace(/[^a-z0-9]/gi,'_')) || '0') + 1;

        localStorage.setItem('clothink_views_' + data.img.replace(/[^a-z0-9]/gi,'_'), String(views));

        var authorHtml = '<a href="' + authorLink(data.author) + '" class="outfit-author-link">' + data.author + '</a>';

        var tagsHtml = data.tags && data.tags.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">' + data.tags.map(function(t){return '<span style="font-size:11px;color:#555;background:#f0f0f0;padding:4px 10px;border-radius:100px;">'+t+'</span>';}).join('') + '</div>' : '';

        container.innerHTML = '<a href="javascript:history.back()" class="back-link">?? Geri</a><div class="outfit-hero"><div class="outfit-hero-photo" style="background-image:url(\'' + data.img + '\')"></div><div class="outfit-hero-info"><h1>' + (data.title || 'Kombin') + '</h1>' + tagsHtml + '<p class="outfit-author">' + authorHtml + '  ' + data.likes + ' begeni  ' + views + ' grntlenme</p><p style="color:#666;line-height:1.7;margin-bottom:24px;">' + (data.desc || '') + '</p><h5 style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:12px;">KOMBNDEK ?RUNLER</h5><div class="product-list" id="productList"></div><div id="d3Carousel" style="display:none;position:relative;width:100%;height:400px;border-radius:0;overflow:hidden;margin-bottom:24px;perspective:1200px;">
<div id="d3Inner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;transform-style:preserve-3d;transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);"></div>
<button onclick="rotate3D(-90)" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;">&#8592;</button>
<button onclick="rotate3D(90)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;">&#8594;</button>
</div>
<div class="action-bar"><button id="detailLikeBtn" class="' + (liked ? 'like-btn-action liked' : 'like-btn-action') + '" onclick="toggleLike()">' + (data.likes || 0) + '</button><button id="detailSaveBtn" class="' + (saved ? 'save-btn-action saved' : 'save-btn-action') + '" onclick="toggleSave()">' + (saved ? 'Kaydedildi' : 'Kaydet') + '</button><button class="share-btn-action" onclick="shareOutfit()">Paylas</button><button class="share-btn-action" onclick="event.stopPropagation();aiReview()" style="background:#f9f6f0;color:#c9a84c;">AI Yorumla</button><button class="btn-primary" style="border:none;cursor:pointer;" onclick="alert(\'Satn alma islemi iin markann sitesine ynlendirileceksiniz.\')">Kombini Satn Al</button></div></div></div>';

        var list = document.getElementById('productList');

        if (data.products && data.products.length) {

            data.products.forEach(function(p) {

                var div = document.createElement('div');

                div.className = 'product-item';

                var shopLink = p.url ? ' <a href="' + p.url + '" target="_blank" style="color:#111;font-weight:600;text-decoration:none;font-size:12px;">Satn Al ?</a>' : '';

                var cartBtn = ' <button onclick="event.stopPropagation();addToCart(\'' + p.name.replace(/'/g,"\\'") + '\',\'' + p.brand.replace(/'/g,"\\'") + '\',\'' + (p.price||'??0') + '\',\'' + p.img + '\')" style="background:none;border:none;cursor:pointer;font-size:11px;padding:2px 8px;letter-spacing:1px;text-transform:uppercase;color:#888;transition:color 0.2s;" title="Sepete Ekle">Sepet</button>';

                div.innerHTML = '<div class="product-thumb" style="background-image:url(\'' + p.img + '\')"></div><div style="flex:1;"><h4>' + p.name + '</h4><p>' + p.brand + '  ' + p.price + shopLink + cartBtn + '</p></div>';

                list.appendChild(div);

            });

        }

        window.toggleLike = function() {

            user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

            if (!user) { window.location.href = 'giris.html'; return; }

            likes = JSON.parse(localStorage.getItem('clothink_likes_' + user.email) || '[]');

            var idx = likes.indexOf(data.img);

            var btn = document.getElementById('detailLikeBtn');

            if (idx > -1) { likes.splice(idx, 1); btn.classList.remove('liked'); data.likes = Math.max(0, (data.likes || 0) - 1); }

            else { likes.push(data.img); btn.classList.add('liked'); data.likes = (data.likes || 0) + 1; }

            localStorage.setItem('clothink_likes_' + user.email, JSON.stringify(likes));

            btn.textContent = '' + data.likes + '';

        };

        window.shareOutfit = function() {

            var text = (data.title || 'Kombin') + ' ? Clothink\'te kesfettim!';

            if (navigator.share) { navigator.share({ title: data.title || 'Kombin', text: text }); }

            else { prompt('Linki kopyala:', window.location.href); }

        };

        var grid = document.getElementById('otherGrid');

        var allOutfits = [];

        ['kadin','erkek','cocuk'].forEach(function(g) {

            var cat = JSON.parse(localStorage.getItem('clothink_catalog_' + g) || 'null');

            if (cat) allOutfits = allOutfits.concat(cat);

        });

        if (allOutfits.length === 0) {

            grid.innerHTML = '<p style="color:#999;grid-column:1/-1;text-align:center;padding:40px 0;">Diger kombinler yklenemedi.</p>';

            return;

        }

        var others = allOutfits.filter(function(o) { return o.img !== data.img; }).slice(0, 4);

        others.forEach(function(o) {

            var div = document.createElement('div');

            div.className = 'outfit-card';

            div.dataset.img = o.img;

            var liked2 = likes.indexOf(o.img) > -1;

            var authorHtml2 = '<a href="' + authorLink(o.author) + '" class="outfit-author-link" onclick="event.stopPropagation()">' + o.author + '</a>';

            div.innerHTML = '<div class="outfit-photo" style="background-image:url(\'' + o.img + '\')"></div><div class="outfit-info"><div><p class="outfit-author">' + authorHtml2 + '</p><p class="outfit-items">' + o.items + '</p></div><p class="outfit-like" style="' + (liked2 ? 'color:#e74c3c' : '') + '">' + o.likes + '</p></div>';

            div.addEventListener('click', function(e) {

                if (e.target.closest('.outfit-author-link')) return;

                localStorage.setItem('clothink_viewing_outfit', JSON.stringify(o));

                window.location.reload();

            });

            grid.appendChild(div);

        });



        // toggle save

        window.toggle3D = function() {
            var carousel = document.getElementById('d3Carousel');
            if (!carousel || !data) return;
            if (carousel.style.display === 'block') { carousel.style.display = 'none'; return; }
            carousel.style.display = 'block';
            var inner = document.getElementById('d3Inner');
            inner.innerHTML = '';
            var images = [data.img];
            if (data.products) data.products.forEach(function(p) { images.push(p.img); });
            var total = images.length;
            var radius = 180;
            images.forEach(function(img, i) {
                var angle = (i / total) * Math.PI * 2;
                var div = document.createElement('div');
                div.style.cssText = 'position:absolute;width:160px;height:220px;border-radius:4px;background-size:cover;background-position:center;background-image:url(' + img + ');box-shadow:0 8px 32px rgba(0,0,0,0.3);';
                div.style.transform = 'rotateY(' + (angle * 180/Math.PI) + 'deg) translateZ(' + radius + 'px)';
                inner.appendChild(div);
            });
        };
        window.rotate3D = function(deg) {
            var inner = document.getElementById('d3Inner');
            if (!inner) return;
            var current = parseFloat(inner.getAttribute('data-angle') || '0');
            current += deg;
            inner.setAttribute('data-angle', current);
            inner.style.transform = 'rotateY(' + current + 'deg)';
        };
        window.toggleSave = function() {

            user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

            if (!user) { window.location.href = 'giris.html'; return; }

            var saves = JSON.parse(localStorage.getItem('clothink_saves_' + user.email) || '[]');

            var idx = saves.indexOf(data.img);

            var btn = document.getElementById('detailSaveBtn');

            if (idx > -1) { saves.splice(idx, 1); btn.classList.remove('saved'); btn.textContent = 'Kaydet'; }

            else { saves.push(data.img); btn.classList.add('saved'); btn.textContent = 'Kaydedildi'; }

            localStorage.setItem('clothink_saves_' + user.email, JSON.stringify(saves));

        };



        // AI OUTFIT REVIEW
        window.aiReview = function() {
            if (!data) return;
            var itemCount = (data.products && data.products.length) || parseInt(data.items) || 0;
            var hasBrands = [];
            var totalPrice = 0;
            var categories = {};
            if (data.products) data.products.forEach(function(p){
                if (p.brand) hasBrands.push(p.brand);
                if (p.price) totalPrice += parseInt(p.price.replace(/[^0-9]/g,'')) || 0;
                if (p.cat) categories[p.cat] = true;
            });
            
            // Generate AI review based on data
            var reviews = [];
            
            // Item count analysis
            if (itemCount <= 2) reviews.push("Bu minimalist bir kombin. Az parca ile cok sey anlatmak ustalik ister — basarilmis.");
            else if (itemCount <= 4) reviews.push("Dengeli bir secim. " + itemCount + " parca ile gunluk kullanim icin ideal bir kombin olusturulmus.");
            else reviews.push("Zengin bir kombin! " + itemCount + " parca ile detayli bir stil ortaya cikmis. Aksesuar kullanimi dikkat cekici.");
            
            // Brand analysis
            if (hasBrands.length > 0) {
                var luxuryBrands = ['GUCCI','PRADA','ARMANI','BOSS','BURBERRY','DIOR','JIMMY CHOO','ALLSAINTS'];
                var hasLuxury = hasBrands.some(function(b){ return luxuryBrands.indexOf(b.toUpperCase()) > -1; });
                if (hasLuxury) reviews.push("Luxury marka tercihi bu kombinie premium bir hava katmis. Yatirimlik parcalar akilli secim.");
                var mixed = hasBrands.some(function(b){ return b.toUpperCase() === 'ZARA' || b.toUpperCase() === 'H&M'; }) && hasLuxury;
                if (mixed) reviews.push("High-low mix harika! Luks ve uygun fiyatli markalari harmanlamak modern stilin altin kuralidir.");
            }
            
            // Category analysis
            var catCount = Object.keys(categories).length;
            if (catCount >= 3) reviews.push("Ust, alt, ayakkabi ve aksesuar kategorilerinde tamamlayici secimler yapilmis. Butunsel bir kombin.");
            
            // Price analysis
            if (totalPrice > 5000) reviews.push("Premium bir yatirim kombinasyonu. Toplam deger: TL" + totalPrice.toLocaleString() + " civari.");
            else if (totalPrice > 1000) reviews.push("Fiyat-performans dengesi iyi kurulmus. Butcenizi zorlamadan stil sahibi olunabileceginin kaniti.");
            
            // General styling tips
            reviews.push("Genel olarak bu kombin mevcut trendlerle uyumlu. Kisisel tarzinizi yansitmak icin guzel bir baslangic.");
            
            // Add as AI comment
            var aiComment = {
                name: 'Clothink AI',
                text: reviews[Math.floor(Math.random() * reviews.length)],
                date: new Date().toISOString(),
                isAI: true
            };
            comments.unshift(aiComment);
            localStorage.setItem(commentKey, JSON.stringify(comments));
            renderComments();
        };
        var commentKey = 'clothink_comments_' + data.img.replace(/[^a-z0-9]/gi,'_');
        var comments = JSON.parse(localStorage.getItem(commentKey) || '[]');
        var ca = document.getElementById('commentsArea');
        function renderComments() {
            var html = '<div class="comments-box"><h3>Yorumlar (' + comments.length + ')</h3><div class="comment-input-wrap"><input id="commentInput" placeholder="Yorum yaz..." onkeydown="if(event.key===\'Enter\')postComment()"><button onclick="postComment()">Gonder</button></div>';
            if (comments.length === 0) html += '<p style="color:#999;font-size:14px;">Henuz yorum yok. Ilk yorumu sen yap!</p>';
            comments.forEach(function(c) {
                var initial = (c.name || '?').charAt(0).toUpperCase();
                if (c.isAI) {
                    html += '<div class="comment-item" style="background:#f9f6f0;border-left:2px solid #c9a84c;"><div class="comment-avatar" style="background:#c9a84c;color:#fff;">AI</div><div class="comment-body"><div class="comment-author" style="color:#c9a84c;">Clothink AI ✦</div><div class="comment-text">' + c.text + '</div><div class="comment-date">AI Analizi</div></div></div>';
                } else {

                html += '<div class="comment-item"><div class="comment-avatar">' + initial + '</div><div class="comment-body"><div class="comment-author">' + c.name + '</div><div class="comment-text">' + c.text + '</div><div class="comment-date">' + new Date(c.date).toLocaleDateString('tr-TR') + '</div></div></div>';

            });

            html += '</div>';

            ca.innerHTML = html;

        }

        window.postComment = function() {

            user = JSON.parse(localStorage.getItem('clothink_user') || 'null');

            if (!user) { window.location.href = 'giris.html'; return; }

            var input = document.getElementById('commentInput');

            var text = input.value.trim();

            if (!text) return;

            comments.push({ name: user.name || 'Kullanc', text: text, date: new Date().toISOString() });

            localStorage.setItem(commentKey, JSON.stringify(comments));

            input.value = '';

            renderComments();

            // notify outfit author if different user

            // (in a real app we'd look up the author email)

        };

        renderComments();

    })();

    </script>

</body>

</html>
