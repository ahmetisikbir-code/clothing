    function findEmailByUsername(username) {

        var clean = username.replace('@','').toLowerCase();

        var profiles = JSON.parse(localStorage.getItem('clothink_profiles') || '{}');

        var users = JSON.parse(localStorage.getItem('clothink_users') || '[]');

        for (var i = 0; i < users.length; i++) {

            var p = profiles[users[i].email] || {};

            if (p.username && p.username.toLowerCase() === clean) return users[i].email;

        }

        return null;

    }

            allUsersList.forEach(function(uu) {

            renderOutfits(catalogOutfits, fallbackUsername);

        }



        window.toggleFollow = function(email) {

            var myUser = JSON.parse(localStorage.getItem('clothink_user') || 'null');

            if (!myUser) { window.location.href = 'giris.html'; return; }

            var following = JSON.parse(localStorage.getItem('clothink_following_' + myUser.email) || '[]');

            var idx = following.indexOf(email);

            if (idx > -1) { following.splice(idx, 1); }

            else { following.push(email); }

            localStorage.setItem('clothink_following_' + myUser.email, JSON.stringify(following));

            // add notification

            if (typeof addNotification === 'function' && idx === -1) {

                addNotification(email, 'follow', myUser.email, myUser.name + ' seni takip etmeye baslad!');

            }

            window.location.reload();

        };



        function renderOutfits(outfits, displayName) {

            var grid = document.getElementById('userOutfitsGrid');

            grid.innerHTML = '';

            var myUser = JSON.parse(localStorage.getItem('clothink_user') || 'null');

            var myLikes = myUser ? JSON.parse(localStorage.getItem('clothink_likes_' + myUser.email) || '[]') : [];



            if (outfits.length === 0) {

                grid.innerHTML = '<div class="empty-state">Bu kullancnn henz kombin paylasm yok.</div>';

                return;

            }



            outfits.forEach(function(o) {

                if (!o.img && !o.image) return;

                var imgUrl = o.img || o.image;

                var div = document.createElement('div');

                div.className = 'outfit-card';

                div.dataset.img = imgUrl;

                var liked = myLikes.indexOf(imgUrl) > -1;

                var tagsHtml = o.tags && o.tags.length ? '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">' + o.tags.map(function(t){return '<span style="font-size:10px;color:#888;background:#f0f0f0;padding:2px 6px;border-radius:100px;">'+t+'</span>';}).join('') + '</div>' : '';

                div.innerHTML = '<div class="outfit-photo" style="background-image:url(\'' + imgUrl + '\')"></div><div class="outfit-info"><div><p class="outfit-author">@' + displayName + '</p><p class="outfit-items">' + (o.items || '0') + ' rn</p>' + tagsHtml + '</div><p class="outfit-like like-btn" style="cursor:pointer;' + (liked ? 'color:#c9a84c' : '') + '">' + (o.likes || 0) + '</p></div>';

                div.addEventListener('click', function(e) {

                    if (e.target.closest('.like-btn')) return;

                    var od = { title: o.title, author: '@' + displayName, items: (o.items || '0') + ' rn', likes: o.likes || 0, img: imgUrl, desc: o.desc || '', products: o.products || [] };

                    localStorage.setItem('clothink_viewing_outfit', JSON.stringify(od));

                    window.location.href = 'kombinler.html';

                });

                grid.appendChild(div);

            });



            grid.addEventListener('click', function(e) {

                var btn = e.target.closest('.like-btn');

                if (!btn) return;

                myUser = JSON.parse(localStorage.getItem('clothink_user') || 'null');

                if (!myUser) { window.location.href = 'giris.html'; return; }

                var card = btn.closest('.outfit-card');

                var url = card ? card.dataset.img : '';

                if (!url) return;

                myLikes = JSON.parse(localStorage.getItem('clothink_likes_' + myUser.email) || '[]');

                var idx = myLikes.indexOf(url);

                if (idx > -1) { myLikes.splice(idx, 1); btn.style.color = '#777'; }

                else { myLikes.push(url); btn.style.color = '#e74c3c'; }

                localStorage.setItem('clothink_likes_' + myUser.email, JSON.stringify(myLikes));

                var match = btn.textContent.match(/(\d+)/);

                if (match) btn.textContent = '' + (idx > -1 ? parseInt(match[1]) - 1 : parseInt(match[1]) + 1);

            });

        }

    })();

    </script>
